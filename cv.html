<!doctype html>
<html lang="en">

<head>

    <!-- =========================
         BASIC PAGE SETUP
    ========================== -->

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>CV | Bruno Machado</title>


    <!-- =========================
         FONTS
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         MAIN STYLESHEET
    ========================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div id="header"></div>




    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>


        <!-- =========================
             HERO SECTION
        ========================== -->

        <section class="hero">

            <div class="wrap">

                <!-- Page Title -->

                <h1 class="head">
                    My CV
                </h1>


                <!-- Page Description -->

                <p>
                    A concise overview of my education, skills
                    and experience in game and software development.
                </p>


            </div>

        </section>



        <!-- =========================
             CV SECTION
        ========================== -->

        <section class="section">

            <div class="wrap">


                <div class="cv-box reveal">


                    <!-- Section Title -->

                    <h2 class="head">
                        CV Preview
                    </h2>


                    <iframe
                        class="cv-pdf"
                        src="Assets/documents/Bruno_Machado_CV.pdf"
                        title="Bruno Machado CV"
                    ></iframe>


                    <!-- =========================
                         DOWNLOAD BUTTON
                    ========================== -->

                    <a
                        class="btn btn-primary"
                        href="Assets/documents/Bruno_Machado_CV.pdf"
                        download
                    >
                        DOWNLOAD CV
                    </a>


                </div>


            </div>

        </section>


    </main>


   <div id="footer"></div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="main.js"></script>


</body>

</html>
