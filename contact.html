<!doctype html>
<html lang="en">

<head>

    <!-- Basic Page Setup -->
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Contact | Bruno Machado</title>


    <!-- Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >


    <!-- Main Stylesheet -->
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <div id="header"></div>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main>


        <!-- =========================
             HERO SECTION
        ========================== -->

        <section class="hero">

            <div class="wrap">

                <!-- Page Title -->

                <h1 class="head">
                    Let’s get in touch.
                </h1>


                <!-- Page Description -->

                <p>
                    I’m always open to discussing game development,
                    internship opportunities, creative projects
                    and collaborations.
                </p>


            </div>

        </section>



        <!-- =========================
             CONTACT SECTION
        ========================== -->

        <section class="section">

            <div class="wrap grid contact-grid">


                <!-- =========================
                     CONTACT FORM
                ========================== -->

                <div class="contact-card reveal">

                    <form
                        class="form contact-form"
                    >


                        <!-- Name -->

                        <label>

                            Name

                            <input
                                required
                                name="name"
                                placeholder="Your name"
                            >

                        </label>



                        <!-- Email -->

                        <label>

                            Email

                            <input
                                required
                                type="email"
                                name="email"
                                placeholder="you@example.com"
                            >

                        </label>



                        <!-- Subject -->

                        <label>

                            Subject

                            <input
                                required
                                name="subject"
                                placeholder="What would you like to discuss?"
                            >

                        </label>



                        <!-- Message -->

                        <label>

                            Message

                            <textarea
                                required
                                name="message"
                                placeholder="Write your message..."
                            ></textarea>

                        </label>



                        <!-- Submit Button -->

                        <button
                            class="btn btn-primary"
                            type="submit"
                        >
                            SEND MESSAGE
                        </button>


                    </form>

                </div>



                <!-- =========================
                        SOCIAL LINKS
                    ========================= -->

                    <aside class="contact-card reveal">

                        <!-- Section Title -->

                        <h2 class="head">
                            Find me online
                        </h2>


                        <div class="contact-links">


                            <!-- LinkedIn -->

                            <a
                                class="contact-link"
                                href="https://www.linkedin.com/in/bruno-machado-ab34a6379/"
                                target="_blank"
                                rel="noopener"
                            >
                                LinkedIn
                            </a>


                            <!-- GitHub -->

                            <a
                                class="contact-link"
                                href="https://github.com/Brun-00"
                                target="_blank"
                                rel="noopener"
                            >
                                GitHub
                            </a>


                            <!-- itch.io -->

                            <a
                                class="contact-link"
                                href="https://brun-00.itch.io/"
                                target="_blank"
                                rel="noopener"
                            >
                                itch.io
                            </a>

                            <a
                                class="contact-link"
                                href="https://www.instagram.com/brun_00_dev/"
                                target="_blank"
                                rel="noopener"
                            >
                                Instagram
                            </a>


                            <!-- Email -->

                            <a
                                class="contact-link"
                                href="mailto:bruno.lm.2422@gmail.com"
                            >
                                Email
                            </a>


                        </div>

                    </aside>


            </div>

        </section>


    </main>



    <div id="footer"></div>


    <!-- Main JavaScript -->

    <script src="main.js"></script>


</body>

</html>
